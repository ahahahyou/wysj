<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>百科图鉴</title>
    <style>
        body { margin: 0; padding: 0; }
        figure {
            position: relative;
            width: 100%;
            margin: 0 auto;
        }
        figure img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 导航按钮的通用样式（修改为文字+背景全透明，其他属性不变） */
        .nav-link {
            position: absolute;
            text-decoration: none;
            background-color: transparent; /* 导航按钮背景透明 */
            color: transparent; /* 导航按钮文字透明 */
            cursor: pointer;
            width: 5%;
            height: 2.2%;
            border-radius: 4px;
            text-align: center;
            line-height: 2.2vw;
            font-size: 1vw;
            font-weight: bold;
        }

        /* 调整“首页”按钮的位置（和原代码一致） */
        #btn-home {
            top: 6%; left: 33%;
        }

        /* 调整“百科图鉴”按钮的位置（和原代码一致，取消高亮，改为全透明） */
        #btn-encyclopedia {
            top: 6%; left: 39%;
            background-color: transparent; /* 取消原有绿色高亮，改为背景透明 */
            color: transparent; /* 取消原有白色文字，改为文字透明 */
        }

        /* 调整“互动社区”按钮的位置（和原代码一致） */
        #btn-community {
            top: 6%; left: 46%;
        }

        /* “蓝裙美凤蝶”卡片按钮（修改为文字+背景全透明，其他属性不变） */
        .card-link {
            position: absolute;
            text-decoration: none;
            background-color: transparent; /* 卡片按钮背景透明 */
            color: transparent; /* 卡片按钮文字透明 */
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            top: 26.5%; left: 34%; width: 10%; height: 20%; line-height: 8vw; font-size: 1.2vw;
        }

    </style>
</head>
<body>

    <figure>
        <!-- 替换为百科图鉴的图片，确保图片路径正确 -->
        <img src="百科图鉴.png" alt="百科图鉴">

        <!-- 三个导航按钮（跳转路径不变，样式已改为全透明） -->
        <a href="index.html" id="btn-home" class="nav-link">首页</a>
        <a href="bktj.html" id="btn-encyclopedia" class="nav-link">百科图鉴</a>
        <!-- 若互动社区实际文件是hd.html，可将下面的href改为hd.html -->
        <a href="hd.html" id="btn-community" class="nav-link">互动社区</a>

        <!-- “蓝裙美凤蝶”卡片按钮（跳转路径不变，样式已改为全透明） -->
        <a href="jsy.html" class="card-link">蓝裙美凤蝶</a>

    </figure>

</body>
</html>
